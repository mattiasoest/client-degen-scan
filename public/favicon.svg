<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <style>
      @font-face {
        font-family: "Share Tech Mono";
        src: url("./fonts/ShareTechMono-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
      }
    </style>
    <linearGradient id="bg" x1="8" y1="8" x2="56" y2="56">
      <stop stop-color="#0e1512" />
      <stop offset="0.55" stop-color="#070d0a" />
      <stop offset="1" stop-color="#03070a" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" rx="58%" ry="42%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#00ff41" stop-opacity="0.22" />
      <stop offset="72%" stop-color="#00ff41" stop-opacity="0" />
    </radialGradient>
    <filter id="haloBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6.5" />
    </filter>
    <filter id="titleGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6.5" result="blurWide" />
      <feFlood flood-color="#00ff41" flood-opacity="0.65" result="colorWide" />
      <feComposite in="colorWide" in2="blurWide" operator="in" result="glowWide" />
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="blurTight" />
      <feFlood flood-color="#00ff41" flood-opacity="0.95" result="colorTight" />
      <feComposite in="colorTight" in2="blurTight" operator="in" result="glowTight" />
      <feMerge>
        <feMergeNode in="glowWide" />
        <feMergeNode in="glowTight" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="13" fill="url(#bg)" />
  <rect
    x="4.5"
    y="4.5"
    width="55"
    height="55"
    rx="12.5"
    stroke="#00ff41"
    stroke-opacity="0.22"
  />
  <ellipse
    cx="32"
    cy="32"
    rx="22"
    ry="15"
    fill="url(#halo)"
    filter="url(#haloBlur)"
  />
  <text
    x="32"
    y="42"
    text-anchor="middle"
    font-family="'Share Tech Mono', ui-monospace, monospace"
    font-size="38"
    font-weight="400"
    fill="#00ff41"
    filter="url(#titleGlow)"
  >
    $
  </text>
</svg>
